---
layout: main.njk
title: RSVP
---
<form method="POST" action="/api/submit" class="flow">
  <div class="input">
    <label for="name">Your Name</label>
    <input id="name" name="name" type="text" required />
  </div>

  <fieldset>
    <legend>Are you coming?</legend>
    <input type="radio" name="rsvp" id="yes" value="Coming" required><label for="yes">Yes! Can't wait</label><br>
    <input type="radio" name="rsvp" id="no" value="Not Coming" required><label for="no">Sorry, no</label>
  </fieldset>

  <fieldset hidden id="guest-type">
    <legend>When are you coming?</legend>
    <input type="radio" name="guest_type" id="guest-type-all" value="All" required><label for="guest-type-all">The whole 3 days!</label><br>
    <input type="radio" name="guest_type" id="guest-type-day" value="Ceremony" required><label for="guest-type-day">The Ceremony</label><br>
    <input type="radio" name="guest_type" id="guest-type-evening" value="Evening" required><label for="guest-type-evening">The Evening Do</label>
  </fieldset>

  <fieldset hidden id="sunday">
    <legend>Will you be attending the Sunday Funday</legend>
    <input type="radio" name="sunday" id="sunday-yes" value="Yes" required><label for="sunday-yes">Yes</label><br>
    <input type="radio" name="sunday" id="sunday-no" value="No" required checked><label for="sunday-no">No</label>
  </fieldset>

  <div hidden class="flow" id="meal">
    <h2>Wedding Breakfast</h2>
    <fieldset>
      <legend>What would you like for your main meal?</legend>
      <input type="radio" name="main_meal" id="main-meal-chicken" value="Chicken" required><label for="main-meal-chicken">Chicken</label><br>
      <input type="radio" name="main_meal" id="main-meal-beef" value="Beef" required><label for="main-meal-beef">Slow Cooked Beef</label><br>
      <input type="radio" name="main_meal" id="main-meal-tart" value="Veggie" required><label for="main-meal-tart">Mediterranean Tart (v)</label><br>
      <input type="radio" name="main_meal" id="main-meal-kids" value="Kids" required><label for="main-meal-kids">Fish Fingers (children)</label>
    </fieldset>

    <fieldset>
      <legend>What would you like for dessert?</legend>
      <input type="radio" name="dessert" id="dessert-trio" value="Trio" required><label for="dessert-trio">Northside Trio</label><br>
      <input type="radio" name="dessert" id="dessert-stp" value="STP" required><label for="dessert-stp">Sticky Toffee Pudding</label><br>
      <input type="radio" name="dessert" id="dessert-posset" value="Posset" required><label for="dessert-posset">Lemon Posset</label><br>
      <input type="radio" name="dessert" id="dessert-kids" value="Kids" required><label for="dessert-3">Ice Cream (children)</label>
    </fieldset>
    <div>
      <label for="dietary">Let us know if you have any dietary requirements</label>
      <input type="text" id="dietary" name="dietary">
    </div>
  
    <div>
      <input type="checkbox" id="non-drinker" name="non_drinker" value="Non-drinker">
      <label for="non-drinker">I'm a non-drinker</label>
    </div>
  </div>

  <div hidden id="misc">
    <label for="more-info">Is there anything else we need to know?</label>
    <textarea name="more_info" id="more-info" rows="5"></textarea>
  </div>

  <button type="submit">Submit</button>
</form>
