---
layout: main.njk
---
<form method="POST" action="/api/submit">
  <div class="input">
    <label for="name">Your Name(s)</label>
    <input id="name" name="name" type="text" required />
  </div>

  <div class="input">
    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" required/>
  </div>

  <fieldset>
    <legend>Are you coming?</legend>
    <input type="radio" name="coming" id="coming-yes"><label for="coming-yes">Yes! Can't wait.</label>
    <input type="radio" name="coming" id="coming-no"><label for="coming-no">Sorry, no.</label>
  </fieldset>

  <fieldset hidden>
    <legend>When are you coming?</legend>
    <input type="radio" name="guest-type" id="guest-type-all"><label for="guest-type-all">The whole 3 days!</label>
    <input type="radio" name="guest-type" id="guest-type-day"><label for="guest-type-day">The Ceremony</label>
    <input type="radio" name="guest-type" id="guest-type-evening"><label for="guest-type-evening">The Evening Do</label>
  </fieldset>

  <div hidden>
    <h2>Wedding Breakfast</h2>
    <fieldset>
      <legend>What would you like for your main meal?</legend>
      <input type="radio" name="guest-type" id="guest-type-all"><label for="guest-type-all">The whole 3 days!</label>
      <input type="radio" name="guest-type" id="guest-type-day"><label for="guest-type-day">The Ceremony</label>
      <input type="radio" name="guest-type" id="guest-type-evening"><label for="guest-type-evening">The Evening Do</label>
    </fieldset>

    <fieldset>
      <legend>What would you like for dessert?</legend>
      <input type="radio" name="guest-type" id="guest-type-all"><label for="guest-type-all">The whole 3 days!</label>
      <input type="radio" name="guest-type" id="guest-type-day"><label for="guest-type-day">The Ceremony</label>
      <input type="radio" name="guest-type" id="guest-type-evening"><label for="guest-type-evening">The Evening Do</label>
    </fieldset>
  </div>

  <button type="submit">Submit</button>
</form>
